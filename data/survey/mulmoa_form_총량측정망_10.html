											    pDataGubun : $("input[name='pDataGubun']").val(),
											    pDataSubGubun : $("input[name='pDataSubGubun']").val(),
											    pDcVal : $("#data_code").val(),
											    pLgubun : $("#pLgubun").val()
											  },false);
	if(sectionInfos[idx].DEPTH_2_CODE){
		onEvent(sectionInfos, 1, idx);
	}
	if(sectionInfos[idx].DEPTH_3_CODE){
		onEvent(sectionInfos, 2, idx);
	}
	if(sectionInfos[idx].SEARCH_CODE){
		onEvent(sectionInfos, 's', idx);
	}
}

function getChgDateGu(){
	var id = $("#pDateGun :selected").data("id");

	var optionCount = $('#pDateGun option').length;
	var data_code = $("#data_code").val();

	if(selTotGuId == id && selTotGuCnt == optionCount) return;

    	//수질 > 낙동강 하굿둑 today 세팅
      	if(data_code == '315'){         
        	setDay(0);
      	}else{

      		if(data_code == "14"){ //수질 > 비점오염원 (today-8일 ~ today-2일) 디폴트 지정
      			var yesterday = new Date();
      			yesterday.setDate(yesterday.getDate() - 2);

      			var maxDate = yesterday.getFullYear() + "-"
      			            + String(yesterday.getMonth() + 1).padStart(2, "0") + "-"
      			            + String(yesterday.getDate()).padStart(2, "0");

      			$("#pEDay").datepicker("setDate", maxDate);
      		}

        	setDay(6);
         
        	if(data_code == "85"){ //상수도 > 감시항목 > 주자료 > 그래프탭 숨김
            	$("#tabBtns li button").eq(0).trigger('click');
            	$("#tabBtns").closest(".subj_tab").hide();
         	}
      	}
   	}else{
    	if(data_code == "85"){ //상수도 > 감시항목 > 그래프탭 복구
    		$("#tabBtns").closest(".subj_tab").show();

    	//물재해 > 가뭄 > 가뭄현황 및 전망 > 상수도 미보급 시설, 비상급수 > 그래프탭 숨김
    	if(data_code == '149'){

				$("#tabBtns li button").eq(0).trigger('click');
				$("#tabBtns").closest(".subj_tab").hide();
		    }else{
		    	$("#tabBtns").closest(".subj_tab").show();
		    }
    	}
   	}
	
	var today = new Date();

	if (data_code == '11' && dataGubun == '49') {
	    var twoMonthsAgo = new Date();
	    twoMonthsAgo.setMonth(today.getMonth() - 2);
	    today.setHours(0, 0, 0, 0);
	    twoMonthsAgo.setHours(0, 0, 0, 0);
	    var timeDifference = today - twoMonthsAgo;
	    var daysDifference = timeDifference / (1000 * 3600 * 24);
		gfnSetDatePickerTwo("pSDay",'',"pSDay","pSDay");
		$("#pSDay").datepicker("option", "minDate",twoMonthsAgo);
		$("#pEDay").datepicker("option", "minDate",twoMonthsAgo);
		setDay(6);
	}
	
	$("#pSDay").datepicker("option", "maxDate",today);
	$("#pEDay").datepicker("option", "maxDate", today);
	
	
	//조회구분이 1개일경우 안보이게 하자
	if(optionCount == 1){
		$("#pDateGun").parent().hide();

		if(id == '1'){

		}
	}else{
		$("#pDateGun").parent().show();
	}
}

//공간정보 (GIS) 이동
function goGeoIntSearch(pDataCode){
	var data_code = $("#data_code").val();
	var pSpotCds = '';
	var pSpotCdCnt = $("input[name='pSpotCd']").length;

	// 지하수 > 낙동강 하굿둑 일경우 선택한 지점 정보에서 처리
	if(data_code == '368'){
		pSpotCdCnt = $('input:checkbox[name=STATION_CODE]:checked').length;
		
		 var radioChek = [];
         $('input[name="STATION_CODE"]:checked').each(function (i) {
        	 radioChek.push($(this).val());
         });
         
		$.each(radioChek, function(idx, element){
				//pSpotCds += $(this).val();
				pSpotCds += element;
				if (idx != pSpotCdCnt -1 ) {
					pSpotCds += '||';
			    }
		});
	}else{
        //인구현황 행정구역 예외처리
        const pLgubun = $("#pLgubun").val();
        if((data_code == '420' && pLgubun == '01') || data_code == '440') {

            const attr3 = document.querySelector("input[name='ATTR_3']:checked");
            const attr2 = document.querySelector("input[name='ATTR_2']:checked");
            const attr1 = document.querySelector("input[name='ATTR_1']:checked");

            if (attr3) {
                pSpotCds = [attr3.value];
            } else if (attr2) {
                pSpotCds = [attr2.value];
            } else if (attr1) {
                pSpotCds = [attr1.value];
            } else {
                pSpotCds = [];
            }
        } else {
            $("input[name='pSpotCd']").each(function(idx){
                pSpotCds += $(this).val();

                if (idx != pSpotCdCnt - 1) {
                    pSpotCds += '||';
                }
            });
        }
	}
	
	if(pSpotCdCnt == 0){
		alert("자료 조회 후 시도 해 주세요.");
		return;
	}else{
		
		//상수도 시설 일경우, 전체 선택 불가 > 지점 선택 필수
		if(data_code == '23'){
			if($("input[name=ATTR_1_all]").prop('checked') || $('input[name=STATION_CODE]:checked').length < 1){
				alert("지점 선택은 필수입니다.");
				return;
			}
		}
		
		//측정소코드 및 지점코드 링크 전달
		if(pDataCode != null && pDataCode == '9999'){
			$("#searchform > #pDataCode").val(pDataCode);
		}else{
            if(data_code == '420') { // 주민등록인구
                $("#searchform > #pDataCode").val('373');
            } else if(data_code == '440') { // 면적평균강수량
                $("#searchform > #pDataCode").val('374');
            }
		}
		
		// 낙동강 하굿둑 염분 -> 315 , 지하수관측(368) -> 313으로 pDataCode 변경
		if (data_code == '368') {
			$("#searchform > #pDataCode").val('313');
		}
		
		$("#pSpotCds").val(pSpotCds);
		$("#_csrf").val($("meta[name='_csrf']").attr("content"));
		$("#searchform").attr("target","_blank");
		$("#searchform").attr("action","/web/gDashBoard");
		$("#searchform").attr("method","post");
		$("#searchform").submit();
	}
	
}

	//법정동/행정동 코드 세팅
	if($("#gLgdCd").val() != null && $("#gLgdCd").val() != ''){

			var chkid = $("input[name='ATTR_1']:input[value='"+$("#gLgdCd").val().substring(0,2)+"']").attr('id');
			$("#"+chkid).trigger("click");
		}
		if($("input[name='ATTR_2']").length > 0){

			$("#"+chkid).trigger("click");
		}
		if($("input[name='ATTR_3']").length > 0){			
			var chkid = $("input[name='ATTR_3']:input[value='"+$("#gLgdCd").val().substring(0,8)+"']").attr('id');
			$("#"+chkid).trigger("click");
		}
	}
	//수계(대권역) 코드 세팅
	if($("#gLcd").val() != null && $("#gLcd").val() != ''){
		if($("input[name='ATTR_1']").length > 0){			
			var chkid = $("input[name='ATTR_1']:input[value='"+$("#gLcd").val()+"']").attr('id');
			$("#"+chkid).trigger("click");
		}
	}
	//수계(수계-중권역) 코드 세팅
	if($("#gWcd").val() != null && $("#gWcd").val() != ''){
		if($("input[name='ATTR_2']").length > 0){
			var chkid;
			
			//낙동강하굿둑, 녹조(조류) : 중권역 코드
			if(data_code == '315' || data_code == '368'){
				chkid = $("input[name='ATTR_2']:input[value='"+$("#gWcd").val()+"']").attr('id');
			}else if(data_code == '420' || data_code == '440'){
                chkid = $("input[name='ATTR_2']:input[value='"+$("#gWcd").val()+"']").attr('id');
            }else{ //그외 수계 코드
				chkid = $("input[name='ATTR_2']:input[value='"+$("#gWcd").val().substring(0,2)+"']").attr('id');
			}
			
			$("#"+chkid).trigger("click");
		}
		if($("input[name='ATTR_3']").length > 0){			
			var chkid = $("input[name='ATTR_3']:input[value='"+$("#gWcd").val()+"']").attr('id');
			$("#"+chkid).trigger("click");
		}
	}
	//지점 코드 세팅
	if($("#gStationCode").val() != null && $("#gStationCode").val() != ''){
        // SECURE-FIX(CWE-489) 2026-07-13 : 디버그출력 제거: console.log($("#gStationCode").val())

		const referrer = document.referrer;
		if (referrer && referrer.indexOf('/algaeMap/detailPop') !== -1) {
			var stationCodes = $("#gStationCode").val().split('|');
			stationCodes.forEach(function(code) {
			    if (code !== "") {
			        var $targetInput = $("input[name='STATION_CODE'][value='" + code + "']");
			        if ($targetInput.length > 0) {
			            if (!$targetInput.is(":checked")) {
			                $targetInput.trigger("click");
			            }
			        }
			    }
			});
		} else {
            var chkid;

			if($("input[name='STATION_CODE']").length > 0){			
				chkid = $("input[name='STATION_CODE']:input[value='"+$("#gStationCode").val()+"']").attr('id');
				$("#"+chkid).trigger("click");
			} else if(data_code == '420' || data_code == '440') {
                chkid = $("input[name='ATTR_3']:input[value='"+$("#gStationCode").val()+"']").attr('id');
                $("#"+chkid).trigger("click");
            }
		}
		
	}
	
	$(this).delay(500).queue(function(){
		$("input[name='ATTR_1']:checked").focus();
		$("input[name='ATTR_2']:checked").focus();
		$("input[name='ATTR_3']:checked").focus();
		$("input[name='STATION_CODE']:checked").focus();
		$(this).dequeue();
	});
	
	$("#gisForm > #gisPTopDataCode").val("");
}
