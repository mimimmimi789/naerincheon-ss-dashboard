name: probe-sources
on:
  workflow_dispatch:
  push:
    branches: [setup-pipeline]
    paths: [scripts/probe_sources.py, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/probe_sources.py
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
